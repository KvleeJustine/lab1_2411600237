<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KyleFitTrack – Login</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-5">

                <!-- Login Card -->
                <div class="card login-card shadow-lg border-0">
                    <!-- Card Header -->
                    <div class="card-header login-header text-center py-4">
                        <div class="brand-icon mb-2">🏃</div>
                        <h2 class="fw-bold mb-0">KyleFitTrack</h2>
                        <p class="mb-0 opacity-75 small">Fitness Tracker Dashboard</p>
                    </div>

                    <!-- Card Body -->
                    <div class="card-body p-4">
                        <!-- Error Alert -->
                        <div id="loginError" class="alert alert-danger d-none" role="alert">
                            Invalid username or password. Please try again.
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm" novalidate>
                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    placeholder="Enter username"
                                    required
                                    autocomplete="username"
                                />
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter password"
                                    required
                                    autocomplete="current-password"
                                />
                            </div>

                            <!-- Submit -->
                            <div class="d-grid mt-4">
                                <button type="button" class="btn btn-primary-custom fw-bold py-2" id="loginBtn">
                                    Login
                                </button>
                            </div>
                        </form>


                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer text-center py-3 login-footer">
                        <small class="text-muted">Track your steps. Reach your goals. Stay fit.</small>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login JS -->
    <script src="js/login.js"></script>
</body>
</html>
